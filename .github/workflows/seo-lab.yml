name: SEO lab comparison
on:
  pull_request:
    paths:
      - 'divorce-recovery.html'
      - 'masculine-restoration-placeholder-wound.html'
      - 'mens-mental-health.html'
      - 'mens-personal-development.html'
      - 'flamewalker-plus.html'
      - 'scripts/seo_lab_summary.py'
      - '.github/workflows/seo-lab.yml'
permissions:
  contents: read
concurrency:
  group: seo-lab-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.event.pull_request.head.ref == 'growth/seo-p1-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare pre-phase-two and revised public page sources
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/nbjb-before" 0b559f29f0ef1fa76ee8520905470fa9acf7bb21
          mkdir -p "$RUNNER_TEMP/seo-lab"
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/nbjb-before" >"$RUNNER_TEMP/seo-before.log" 2>&1 &
          before_pid=$!
          python -m http.server 8766 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/seo-after.log" 2>&1 &
          after_pid=$!
          trap 'kill "$before_pid" "$after_pid" || true' EXIT
          for port in 8765 8766; do
            for i in {1..10}; do
              if curl -fsS "http://127.0.0.1:$port/divorce-recovery.html" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/divorce-recovery.html" >/dev/null
          done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          npm exec --yes --package lighthouse@13.6.0 -- lighthouse --version
          for page in divorce-recovery masculine-restoration-placeholder-wound; do
            for variant in before after; do
              port=8765; if [ "$variant" = after ]; then port=8766; fi
              npm exec --yes --package lighthouse@13.6.0 -- lighthouse "http://127.0.0.1:$port/$page.html" --quiet --only-categories=performance,accessibility,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="$RUNNER_TEMP/seo-lab/$page-$variant-mobile.json"
            done
          done
          for variant in before after; do
            port=8765; if [ "$variant" = after ]; then port=8766; fi
            npm exec --yes --package lighthouse@13.6.0 -- lighthouse "http://127.0.0.1:$port/divorce-recovery.html" --preset=desktop --quiet --only-categories=performance,accessibility,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="$RUNNER_TEMP/seo-lab/divorce-recovery-$variant-desktop.json"
          done
          python scripts/seo_lab_summary.py "$RUNNER_TEMP/seo-lab" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-lab-json
          path: ${{ runner.temp }}/seo-lab/
          retention-days: 14
          if-no-files-found: warn
