name: Validate static site

on:
  push:
    branches:
      - main
      - development
      - 'staging/**'
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'SEO.md'
      - 'README.md'
      - 'scripts/validate_site.py'
      - '.github/workflows/validate-site.yml'
  pull_request:
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'SEO.md'
      - 'README.md'
      - 'scripts/validate_site.py'
      - '.github/workflows/validate-site.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate structure, navigation, links, SEO, accessibility basics, and launch wiring
        run: python scripts/validate_site.py
