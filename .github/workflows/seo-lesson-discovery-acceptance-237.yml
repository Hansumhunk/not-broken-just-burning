name: Lesson discovery release acceptance - PR 237
on:
  push:
    branches: [qa/seo-production-acceptance-240]
    paths: ['.github/workflows/seo-lesson-discovery-acceptance-237.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a76ac5df0f517002ec46af4eb6296df3d77eb50b
      - name: Verify six lesson routes and responsive layout
        shell: bash
        run: |
          python -m pip install playwright==1.51.0
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python -m http.server 8766 --bind 127.0.0.1 > /tmp/nbjb-237-server.log 2>&1 &
          trap 'kill $!' EXIT
          mkdir -p /tmp/nbjb-237-review
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          base="http://127.0.0.1:8766/"
          links=["lesson-clarity-before-certainty.html","lesson-boundaries-are-actions.html","lesson-shame-not-accountability.html","lesson-patterns-are-questions.html","lesson-voice-needs-discipline.html","lesson-peace-is-still-a-life.html"]
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=os.environ["CHROME_PATH"],args=["--no-sandbox"])
              for width,height in ((390,844),(1280,900)):
                  ctx=browser.new_context(viewport={"width":width,"height":height},reduced_motion="reduce")
                  page=ctx.new_page()
                  res=page.goto(base+"lessons.html",wait_until="domcontentloaded",timeout=30000)
                  assert res and res.ok
                  page.evaluate("document.fonts.ready")
                  section=page.locator('section[aria-labelledby="founder-lesson-heading"]')
                  assert section.count()==1
                  assert section.get_by_role("link").count()==6
                  assert page.evaluate("document.documentElement.scrollWidth-innerWidth")<=2
                  for link in links:
                      a=section.locator(f'a[href="{link}"]')
                      assert a.count()==1 and a.inner_text().strip()
                      a.scroll_into_view_if_needed()
                      assert a.is_visible()
                  section.scroll_into_view_if_needed()
                  page.wait_for_timeout(500)
                  section.screenshot(path=f"/tmp/nbjb-237-review/lesson-directory-{width}.png",timeout=20000)
                  for link in links:
                      a=section.locator(f'a[href="{link}"]')
                      a.click()
                      page.wait_for_url(base+link,timeout=15000)
                      assert page.locator("h1").first.is_visible(),link
                      print("PASS lesson navigation",width,link,flush=True)
                      page.go_back(wait_until="domcontentloaded")
                  print("PASS layout and founder lesson visibility",width,flush=True)
                  ctx.close()
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-directory-visual-acceptance
          path: /tmp/nbjb-237-review/
          retention-days: 14
