      - 'CROSS_OPERATION_ACCEPTANCE_STANDARD.md'
      - 'PG_NET_MAINTENANCE_PLAN.md'
      - 'PRODUCTION_ASSURANCE_2026-11-18.md'
      - 'RELEASE_ASSURANCE_PHASE_TWO.md'
      - 'scripts/test_account_export_browser.py'
      - 'scripts/test_assurance_postgres.py'
      - 'scripts/test_auth_security_reference.cjs'
      - 'scripts/test_production_assurance.cjs'
      - 'scripts/test_membership_lifecycle.js'
      - 'MEMBERSHIP_LAUNCH_ACCEPTANCE_2026-11-16.md'
      - 'launch-backend-staging/stripe-live-webhook/**'
      - 'scripts/validate_supabase_runtime.py'
      - 'supabase/migrations/**'
      - 'PLATFORM_QA_GATE_2026-11-05.md'
      - 'FLAMEWALKER_PLUS_RELEASE_CHECKLIST.md'
      - '.github/workflows/validate-site.yml'
      - '.github/workflows/clear-stale-pages.yml'
      - '.github/workflows/flame-spirits.yml'
      - 'scripts/flame_spirits.mjs'
      - 'scripts/test_flame_spirits.mjs'
      - 'scripts/flame_spirits_guardrails.mjs'
      - '.github/workflows/flame-spirit-products.yml'
      - 'scripts/flame_spirit_products.mjs'
      - 'scripts/test_flame_spirit_products.mjs'
      - '.github/workflows/flame-marshal.yml'
      - 'scripts/flame_marshal.mjs'
      - 'scripts/test_flame_marshal.mjs'
      - '.github/workflows/flame-spirit-reach.yml'
      - 'scripts/flame_spirit_reach.mjs'
      - 'scripts/test_flame_spirit_reach.mjs'
      - '.github/workflows/flame-spirit-welcome.yml'
      - 'scripts/flame_spirit_welcome.mjs'
      - 'scripts/test_flame_spirit_welcome.mjs'
      - 'FLAME_SPIRITS.md'
  pull_request:
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'SEO.md'
      - 'README.md'
      - 'FLAMEWALKER_FREE_BETA_LAUNCH.md'
      - 'scripts/validate_site.py'
      - 'scripts/social_share_image.py'
      - 'scripts/test_social_share.py'
      - 'scripts/test_member_save_flow.js'
      - 'scripts/test_first_flame_onboarding.mjs'
      - 'tests/first_flame_member_browser_test.py'
      - 'FIRST_FLAME_ACTIVATION_AUDIT_20261122.md'
      - 'FIRST_FLAME_PROVIDER_ACCEPTANCE_004D.md'
      - 'scripts/test_member_workshop.js'
      - 'scripts/test_member_access_guard.js'
      - 'scripts/test_member_search.js'
      - 'scripts/test_premium_editorial_review.js'
      - 'scripts/test_live_webhook_hardening.js'
      - 'CROSS_OPERATION_ACCEPTANCE_STANDARD.md'
      - 'PG_NET_MAINTENANCE_PLAN.md'
      - 'PRODUCTION_ASSURANCE_2026-11-18.md'
      - 'RELEASE_ASSURANCE_PHASE_TWO.md'
      - 'scripts/test_account_export_browser.py'
      - 'scripts/test_assurance_postgres.py'
      - 'scripts/test_auth_security_reference.cjs'
      - 'scripts/test_production_assurance.cjs'
      - 'scripts/test_membership_lifecycle.js'
