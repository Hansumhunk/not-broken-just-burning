<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Not Broken Just Burning Eye and Flame Sigil</title>
  <desc id="desc">A radiant triangle containing an open eye above a living flame, representing witness, clarity, and transformation.</desc>
  <defs>
    <radialGradient id="emberGlow" cx="50%" cy="56%" r="48%">
      <stop offset="0" stop-color="#ff7a2d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7a2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffad72"/>
      <stop offset="0.48" stop-color="#ff7a2d"/>
      <stop offset="1" stop-color="#d85f24"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="228" fill="url(#emberGlow)"/>

