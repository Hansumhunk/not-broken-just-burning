name: Flame Spirits Mission Control

# Read-only agents for public sources. This is isolated from website deployment and protected lessons.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1,3,5'
      timezone: America/New_York
  pull_request:
    paths:
      - '.github/workflows/flame-spirits.yml'
      - 'scripts/flame_spirits.mjs'
      - 'scripts/test_flame_spirits.mjs'
      - 'FLAME_SPIRITS.md'

permissions:
  contents: read

concurrency:
  group: flame-spirits-mission-control
  cancel-in-progress: false

jobs:
  scouts:
    name: Flame Spirits — read-only reconnaissance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Test Flame Spirits
        run: node --test scripts/test_flame_spirits.mjs

      - name: Run the public-source Flame Spirits
        if: github.event_name != 'pull_request'
        run: node scripts/flame_spirits.mjs all
