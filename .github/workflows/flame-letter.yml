name: Flame Letter release guard
on:
  pull_request:
    paths:
      - 'flame-letter*.html'
      - '.github/flame-letter/templates/**'
      - 'FLAME_LETTER_OPERATIONS.md'
      - 'privacy.html'
      - 'js/main.js'
      - 'index.html'
      - 'join.html'
      - 'resources.html'
      - 'js/flame-letter.js'
      - 'scripts/test_flame_letter.js'
      - 'tests/flame_letter_browser_test.py'
      - '.github/workflows/flame-letter.yml'
  push:
    branches: [main]
    paths:
      - 'flame-letter*.html'
      - '.github/flame-letter/templates/**'
      - 'FLAME_LETTER_OPERATIONS.md'
      - 'privacy.html'
      - 'js/main.js'
      - 'index.html'
      - 'join.html'
      - 'resources.html'
      - 'js/flame-letter.js'
      - 'scripts/test_flame_letter.js'
      - 'tests/flame_letter_browser_test.py'
      - '.github/workflows/flame-letter.yml'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_flame_letter.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Chromium and Playwright
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Run real-browser newsletter checks
        run: python tests/flame_letter_browser_test.py
