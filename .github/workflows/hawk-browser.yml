name: HAWK browser regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'downloads/hawk-*-offline.html'
      - 'tests/hawk_browser_test.py'
      - '.github/workflows/hawk-browser.yml'
permissions:
  contents: read
concurrency:
  group: hawk-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Install pinned accessibility test dependency
        run: npm install --prefix "$RUNNER_TEMP/hawk-a11y" --no-save --ignore-scripts --no-audit --no-fund axe-core@4.10.3
      - name: Verify offline HAWK tools in real Chromium
        run: HAWK_AXE_PATH="$RUNNER_TEMP/hawk-a11y/node_modules/axe-core/axe.min.js" python tests/hawk_browser_test.py
