name: Flame Letter release guard
on:
  pull_request:
    paths:
      - 'flame-letter*.html'
      - 'js/flame-letter.js'
      - 'scripts/test_flame_letter.js'
      - '.github/workflows/flame-letter.yml'
  push:
    branches: [main]
    paths:
      - 'flame-letter*.html'
      - 'js/flame-letter.js'
      - 'scripts/test_flame_letter.js'
      - '.github/workflows/flame-letter.yml'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_flame_letter.js
