name: Validate draft commerce catalog
on:
  pull_request:
    paths:
      - 'store.html'
      - 'commerce-*.html'
      - 'js/commerce-*.js'
      - 'scripts/test_commerce*'
      - 'launch-backend-staging/commerce/**'
      - '.github/workflows/validate-commerce.yml'
permissions:
  contents: read
jobs:
  commerce-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_commerce_catalog.js scripts/test_commerce_security.mjs
      - run: for f in js/commerce-*.js; do node --check "$f"; done
  commerce-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: commerce_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged SQL and exercise ledger in disposable Postgres
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h localhost -U postgres -d commerce_fixture -v ON_ERROR_STOP=1 -f launch-backend-staging/commerce/test-fixture.sql
          psql -h localhost -U postgres -d commerce_fixture -v ON_ERROR_STOP=1 -f launch-backend-staging/commerce/migration.sql
          psql -h localhost -U postgres -d commerce_fixture -v ON_ERROR_STOP=1 -f launch-backend-staging/commerce/test-migration.sql
  commerce-edge-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check launch-backend-staging/commerce/index.ts
