name: Validate static site

on:
  push:
    branches:
      - main
      - development
      - 'staging/**'
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'SEO.md'
      - 'README.md'
      - 'FLAMEWALKER_ACCESS.md'
      - 'SUPABASE_PRODUCTION_AUTH.md'
      - 'FLAMEWALKER_ACCESS.md'
      - 'SUPABASE_PRODUCTION_AUTH.md'
      - 'scripts/validate_site.py'
      - 'scripts/validate_supabase_runtime.py'
      - '.github/workflows/validate-site.yml'
  pull_request:
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'SEO.md'
      - 'README.md'
      - 'scripts/validate_site.py'
      - 'scripts/validate_supabase_runtime.py'
      - '.github/workflows/validate-site.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate structure, navigation, links, SEO, accessibility basics, and launch wiring
        run: python scripts/validate_site.py
      - name: Smoke-test live Flamewalker Supabase Auth
        if: ${{ github.base_ref == 'main' || github.ref_name == 'main' || startsWith(github.ref_name, 'release/') }}
        run: python scripts/validate_supabase_runtime.py
