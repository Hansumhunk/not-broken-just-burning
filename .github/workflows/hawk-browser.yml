name: HAWK browser regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'downloads/hawk-*-offline.html'
      - 'tests/hawk_browser_test.py'
      - '.github/workflows/hawk-browser.yml'
permissions:
  contents: read
concurrency:
  group: hawk-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Verify offline HAWK tools in real Chromium
        run: python tests/hawk_browser_test.py
